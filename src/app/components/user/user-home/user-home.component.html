<h3 class="text-center mt-5">Bienvenido USUARIO</h3>
<div class="container-fluid">
  <div class=" text-end">
    <button class="btn btn-primary"  routerLink="/userHome/1/createVideogame">CREAR VIDEOJUEGO</button>
  </div>
  <table class="table table-striped table-hover mt-4">
    <thead class="table-dark text-uppercase">
      <tr>
        <th>N°</th>
        <th>Nombre</th>
        <th>Plataforma</th>
        <th>Genero</th>
        <th>Número de Copias</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let videojuego of videojuegos ; let i = index">
        <td>{{ i+1 }}</td>
        <td>{{ videojuego.nombre }}</td>
        <td>{{ videojuego.plataforma }}</td>
        <td>{{ videojuego.genero }}</td>
        <td>{{ videojuego.nuCopias }}</td>
        <td>
          <button class="btn btn-primary text-end" [routerLink]="['/userHome/1/videogame', videojuego.id]">
            Ver Detalles
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
