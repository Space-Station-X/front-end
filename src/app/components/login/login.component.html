<div class="container">
  <div class="row mt-5">
    <div class="col-md-3 col-sm-2"></div>

    <div class="col-md-6  col-sm-8">
      <h2 class="text-center mb-4">Iniciar Sesion</h2>
      <div class="mb-3">
        <label for="user-type" class="form-label">Tipo de Usuario</label>
        <select id="user-type" class="form-select">
          <option value="">Seleccione...</option>
          <option value="cliente">Cliente</option>
          <option value="usuario">Usuario</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de Usuario</label>
        <input type="text" id="username" class="form-control " placeholder="Ingrese su nombre de usuario">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña">
      </div>
      <button class="btn btn-primary w-100 " routerLink="/userHome/1">Iniciar Sesión</button>
      <p id="message" class="mt-3 text-center text-danger"></p>
    </div>
  </div>

  <div class="col-md-3 col-sm-2"></div>
</div>
