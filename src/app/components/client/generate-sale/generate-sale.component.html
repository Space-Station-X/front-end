<app-loading *ngIf="isLoading" message="Conectado con el servidor de Ventas..."></app-loading>
<div *ngIf="!isLoading" class="container-fluid pt-4 bg-danger vh-100">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card m-3">
                <div class="card-header text-bg-primary text-white text-center">
                    <h5 class="mb-0">REGISTRAR VENTA</h5>
                </div>
                <div class="card-body">
                    <form [formGroup]="saleForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <h5 for="form-label">VideoJuego : {{item.nombre}}</h5>
                            <h5 for="form-label">Categoria : {{item.plataforma}}</h5>
                            <h5 for="form-label">Precio : S/ {{item.precio}}</h5>
                        </div>
                        <div class="mb-3">
                            <label for="cantidad" class="form-label " ><strong>Cantidad</strong></label>
                            <input type="number" id="cantidad" class="form-control w-25" formControlName="cantidad"  required [(ngModel)]="ventaDetalle.quantity">
                        </div>
                        <button type="submit" class="btn btn-success " [disabled]="saleForm.invalid">Comprar</button>
                    </form>
                </div>
                <div *ngIf="errorMessage.length !==0" class="alert alert-danger mt-3">
                  {{ errorMessage }}
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade " id="modalSale" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content ">
        <div class="modal-header text-bg-primary">
          <h5 class="modal-title" id="successModalLabel">Éxito</h5>
        </div>
        <div class="modal-body">
          ¡Gracias por su Compra!
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" (click)="hideModal()">Aceptar</button>
        </div>
      </div>
    </div>
  </div>
