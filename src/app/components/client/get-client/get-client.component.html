<app-loading *ngIf="isLoading" message="Conectando con el servidor de clientes"></app-loading>
<div *ngIf="!isLoading" class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card m-3">
                <div class="card-header text-bg-primary text-white">
                    <h5 class="mb-0">Detalles del Cliente</h5>
                </div>
                <div class="card-body">
                    <p><strong>CODIGO:</strong> {{ getClient.id }}</p>
                    <p><strong>DNI:</strong> {{ getClient.numberDocument }}</p>
                    <p><strong>Nombre Completo:</strong> {{ getClient.numberDate}}</p>
                    <p><strong>Activo:</strong> {{ getClient.isActive == 1 ? "S" : "N"}}</p>
                    <p><strong>Teléfono:</strong> {{ getClient.phone }}</p>
                    <p><strong>Fecha de Registro:</strong> {{ getClient.registerDate| date:'dd/MM/yyyy HH:mm' }}</p>
                </div>
                
            </div>
        </div>
    </div>
</div>
