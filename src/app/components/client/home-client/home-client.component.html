<app-loading
  *ngIf="isLoading()"
  message="Cargando catálogo de juegos..."
></app-loading>

@if (!isLoading()) {
<div class="gaming-background">
  <div class="container">
    <app-welcome-banner></app-welcome-banner>

    <div class="games-grid">
      @for (game of videogames(); track game.id) {
        @if (game.activo === 'S') {
          <app-game-card
            [game]="game"
            [clientId]="clientId()"
            (viewDetailsClicked)="openGameDetails($event)"
          ></app-game-card>
        }
      }
      @empty {
        <app-no-games></app-no-games>
      }
    </div>
  </div>
</div>

<app-game-detail-modal
  [game]="selectedGame"
  [clientId]="clientId()"
  [visible]="showModal"
  (close)="closeModal()"
></app-game-detail-modal>
}
