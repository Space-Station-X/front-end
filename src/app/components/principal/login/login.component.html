<app-loading *ngIf="isLoading" message="Validando credenciales..."></app-loading>
<div *ngIf="!isLoading" class="container-fluid vh-100 fondo">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card mt-5">
        <div class="card-body">
          <h2 class="card-title text-center">LOGIN</h2>
          <form (ngSubmit)="login()">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="nombre@example.com" [(ngModel)]="email" required>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="******" [(ngModel)]="password" required>
            </div>
            <button type="submit" class="btn btn-primary mt-2 w-100">Iniciar Sesión</button>
          </form>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
