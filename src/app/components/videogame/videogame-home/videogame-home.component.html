<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 col-sm-12">
            <h2 class="text-center">{{ getVideojuego.nombre }}</h2>

            <div class="row">
                <div class="col-lg-8 border p-3">
                    <div>OLHA</div>
                </div>

                <div class="col-lg-4 mt-3">
                    <p><strong>Plataforma: </strong>{{ getVideojuego.plataforma }}</p>
                    <p><strong>Género: </strong>{{ getVideojuego.genero }}</p>
                    <p><strong>Copias Disponibles: </strong>{{ getVideojuego.nuCopias }}</p>
                    <p><strong>Registrado el: </strong>{{ getVideojuego.feReg }}</p>
                    <p><strong>Precio: </strong>{{ getVideojuego.precio | currency }}</p>
                </div>
            </div>

            <div class="col-12 mt-3">
                <p>{{ getVideojuego.descripcion }}</p>
            </div>
            <div class="d-flex justify-content-around mt-5">
                <button class="btn btn-success" routerLink="/userHome/1/updateVideogame/{{getVideojuego.id}}">Actualizar</button>
                <button class="btn btn-danger" type="button">Eliminar</button>
            </div>
            
            

        </div>
    </div>


</div>
